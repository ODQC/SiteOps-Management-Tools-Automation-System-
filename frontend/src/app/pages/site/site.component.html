<div class="page">
  <mat-card class="page__card" appearance="outlined">
    <div class="page__header">
      <div>
        <h1>Sitios</h1>
        <p>Administra los sitios de la organización.</p>
      </div>
      @if (!soloLectura) {
        <button mat-flat-button color="primary" class="page__new-button" (click)="nuevoParque()">
          <mat-icon>add</mat-icon>
          Nuevo sitio
        </button>
      }
    </div>

    <div class="filters">
      <mat-form-field appearance="outline" class="filters__search">
        <mat-label>Buscador</mat-label>
        <input matInput [(ngModel)]="search" placeholder="Buscar por nombre o código..." />
        <mat-icon matSuffix>search</mat-icon>
      </mat-form-field>
    </div>

    <div class="table-wrapper">
      <table mat-table [dataSource]="parquesFiltrados" class="data-table">
        <ng-container matColumnDef="codigo">
          <th mat-header-cell *matHeaderCellDef>Código</th>
          <td mat-cell *matCellDef="let parque">{{ parque.code }}</td>
        </ng-container>

        <ng-container matColumnDef="nombre">
          <th mat-header-cell *matHeaderCellDef>Nombre</th>
          <td mat-cell *matCellDef="let parque">{{ parque.name }}</td>
        </ng-container>

        <ng-container matColumnDef="area">
          <th mat-header-cell *matHeaderCellDef>Región</th>
          <td mat-cell *matCellDef="let parque">{{ name(parque.fK_idRegion1) }}</td>
        </ng-container>

        <ng-container matColumnDef="editar">
          <th mat-header-cell *matHeaderCellDef></th>
          <td mat-cell *matCellDef="let parque">
            <button mat-stroked-button color="primary" (click)="editarParque(parque)">
              <mat-icon>edit</mat-icon>
              Editar
            </button>
          </td>
        </ng-container>

        <ng-container matColumnDef="estado">
          <th mat-header-cell *matHeaderCellDef>Estado</th>
          <td mat-cell *matCellDef="let parque">
            <button mat-flat-button [color]="parque.status === 'Activo' ? 'primary' : 'warn'" [disabled]="soloLectura" (click)="cambiarEstado(parque)">
              {{ parque.status }}
            </button>
          </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="columnas"></tr>
        <tr mat-row *matRowDef="let row; columns: columnas;"></tr>
      </table>

      @if (parquesFiltrados.length === 0) {
        <div class="table-wrapper__empty">
          <mat-icon>search_off</mat-icon>
          <p>No se encontraron sitios.</p>
        </div>
      }
    </div>
  </mat-card>
</div>
