<div class="page">
  <mat-card class="page__card" appearance="outlined">
    <div class="page__header">
      <div>
        <h1>Goals</h1>
        <p>Manage your organization's goals.</p>
      </div>
      @if (!soloLectura) {
        <button mat-flat-button color="primary" class="page__new-button" (click)="nuevo()">
          <mat-icon>add</mat-icon>
          New goal
        </button>
      }
    </div>

    <div class="filters">
      <mat-form-field appearance="outline" class="filters__search">
        <mat-label>Search</mat-label>
        <input matInput [(ngModel)]="search" placeholder="Search by name or code..." />
        <mat-icon matSuffix>search</mat-icon>
      </mat-form-field>
    </div>

    <div class="table-wrapper">
      <table mat-table [dataSource]="goalsFiltrados" class="data-table">
        <ng-container matColumnDef="codigo">
          <th mat-header-cell *matHeaderCellDef>Code</th>
          <td mat-cell *matCellDef="let o">{{ o.code }}</td>
        </ng-container>

        <ng-container matColumnDef="nombre">
          <th mat-header-cell *matHeaderCellDef>Name</th>
          <td mat-cell *matCellDef="let o">{{ o.name }}</td>
        </ng-container>

        <ng-container matColumnDef="anno">
          <th mat-header-cell *matHeaderCellDef>Year</th>
          <td mat-cell *matCellDef="let o">{{ o.year }}</td>
        </ng-container>

        <ng-container matColumnDef="editar">
          <th mat-header-cell *matHeaderCellDef></th>
          <td mat-cell *matCellDef="let o">
            <button mat-stroked-button color="primary" (click)="editar(o)">
              <mat-icon>edit</mat-icon>
              Edit
            </button>
          </td>
        </ng-container>

        <ng-container matColumnDef="estado">
          <th mat-header-cell *matHeaderCellDef>Status</th>
          <td mat-cell *matCellDef="let o">
            <button mat-flat-button [color]="o.status === 'Activo' ? 'primary' : 'warn'" [disabled]="soloLectura" (click)="cambiarEstado(o)">
              {{ o.status }}
            </button>
          </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="columnas"></tr>
        <tr mat-row *matRowDef="let row; columns: columnas;"></tr>
      </table>

      @if (goalsFiltrados.length === 0) {
        <div class="table-wrapper__empty">
          <mat-icon>search_off</mat-icon>
          <p>No goals found.</p>
        </div>
      }
    </div>
  </mat-card>
</div>
