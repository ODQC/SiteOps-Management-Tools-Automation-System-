<h2 mat-dialog-title>{{ esEdicion ? 'Editar resource' : 'New resource' }}</h2>

<form [formGroup]="formulario" (ngSubmit)="guardar()">
  <mat-dialog-content class="dialog-grid">
    <mat-form-field appearance="outline" class="dialog-grid__field">
      <mat-label>Code</mat-label>
      <input matInput formControlName="code" [readonly]="esEdicion" />
      @if (esCampoValido('code')) {
        <mat-error>Code is required</mat-error>
      }
    </mat-form-field>

    <mat-form-field appearance="outline" class="dialog-grid__field">
      <mat-label>Resource type</mat-label>
      <input matInput formControlName="type" />
      @if (esCampoValido('type')) {
        <mat-error>Type is required</mat-error>
      }
    </mat-form-field>

    <mat-form-field appearance="outline" class="dialog-grid__field dialog-grid__field--full">
      <mat-label>Description</mat-label>
      <textarea matInput formControlName="description" rows="3"></textarea>
      @if (esCampoValido('description')) {
        <mat-error>Description is required</mat-error>
      }
    </mat-form-field>

    <mat-form-field appearance="outline" class="dialog-grid__field">
      <mat-label>Status</mat-label>
      <mat-select formControlName="status">
        <mat-option value="Active">Active</mat-option>
        <mat-option value="Inactive">Inactive</mat-option>
      </mat-select>
    </mat-form-field>
  </mat-dialog-content>

  <mat-dialog-actions align="end">
    <button mat-stroked-button type="button" (click)="cancelar()">Cancel</button>
    <button mat-flat-button color="primary" type="submit">{{ esEdicion ? 'Update' : 'Create' }}</button>
  </mat-dialog-actions>
</form>
