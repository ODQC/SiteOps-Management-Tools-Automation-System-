<div class="page">
  <mat-card class="page__card" appearance="outlined">
    <div class="page__header">
      <div>
        <h1>Resources</h1>
        <p>Manage the resources used in field tasks.</p>
      </div>
      @if (!soloLectura) {
        <button mat-flat-button color="primary" class="page__new-button" (click)="nueva()">
          <mat-icon>add</mat-icon>
          New resource
        </button>
      }
    </div>

    <div class="filters">
      <mat-form-field appearance="outline" class="filters__search">
        <mat-label>Search</mat-label>
        <input matInput [(ngModel)]="search" placeholder="Search by type or code..." />
        <mat-icon matSuffix>search</mat-icon>
      </mat-form-field>
    </div>

    <div class="table-wrapper">
      <table mat-table [dataSource]="resourcesFiltradas" class="data-table">
        <ng-container matColumnDef="codigo">
          <th mat-header-cell *matHeaderCellDef>Code</th>
          <td mat-cell *matCellDef="let h">{{ h.code }}</td>
        </ng-container>

        <ng-container matColumnDef="tipo">
          <th mat-header-cell *matHeaderCellDef>Type</th>
          <td mat-cell *matCellDef="let h">{{ h.type }}</td>
        </ng-container>

        <ng-container matColumnDef="descripcion">
          <th mat-header-cell *matHeaderCellDef>Description</th>
          <td mat-cell *matCellDef="let h">{{ h.description }}</td>
        </ng-container>

        <ng-container matColumnDef="goals">
          <th mat-header-cell *matHeaderCellDef></th>
          <td mat-cell *matCellDef="let h">
            <button mat-stroked-button color="primary" (click)="verGoals(h)">
              <mat-icon>flag</mat-icon>
              Goals
            </button>
          </td>
        </ng-container>

        <ng-container matColumnDef="editar">
          <th mat-header-cell *matHeaderCellDef></th>
          <td mat-cell *matCellDef="let h">
            <button mat-stroked-button color="primary" (click)="editar(h)">
              <mat-icon>edit</mat-icon>
              Edit
            </button>
          </td>
        </ng-container>

        <ng-container matColumnDef="estado">
          <th mat-header-cell *matHeaderCellDef>Status</th>
          <td mat-cell *matCellDef="let h">
            <button mat-flat-button [color]="h.status === 'Active' ? 'primary' : 'warn'" [disabled]="soloLectura" (click)="cambiarEstado(h)">
              {{ h.status }}
            </button>
          </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="columnas"></tr>
        <tr mat-row *matRowDef="let row; columns: columnas;"></tr>
      </table>

      @if (resourcesFiltradas.length === 0) {
        <div class="table-wrapper__empty">
          <mat-icon>search_off</mat-icon>
          <p>No resources found.</p>
        </div>
      }
    </div>
  </mat-card>
</div>
