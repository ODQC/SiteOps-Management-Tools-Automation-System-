<h2 mat-dialog-title>Recupera tu cuenta</h2>

<form [formGroup]="recuperarPasswordForm" (ngSubmit)="onReset()">
  <mat-dialog-content>
    <p class="forgot-dialog__hint">Ingresa el correo institucional para recuperar tu password.</p>

    <mat-form-field appearance="outline" class="forgot-dialog__field">
      <mat-label>Correo institucional</mat-label>
      <input matInput formControlName="recuperarPassword" placeholder="nombre.apellido@sinac.go.cr" />
      @if (esCampoValidoRecuperar('recuperarPassword')) {
        <mat-error>{{ getErrorMensaje('recuperarPassword') }}</mat-error>
      }
    </mat-form-field>
  </mat-dialog-content>

  <mat-dialog-actions align="end">
    <button mat-stroked-button type="button" (click)="cerrar()">Cancelar</button>
    <button mat-flat-button color="primary" type="submit">Enviar</button>
  </mat-dialog-actions>
</form>
