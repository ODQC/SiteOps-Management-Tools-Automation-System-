<h2 mat-dialog-title>Recover your account</h2>

<form [formGroup]="recuperarPasswordForm" (ngSubmit)="onReset()">
  <mat-dialog-content>
    <p class="forgot-dialog__hint">Enter your work email to recover your password.</p>

    <mat-form-field appearance="outline" class="forgot-dialog__field">
      <mat-label>Work email</mat-label>
      <input matInput formControlName="recuperarPassword" placeholder="firstname.lastname@example.com" />
      @if (esCampoValidoRecuperar('recuperarPassword')) {
        <mat-error>{{ getErrorMensaje('recuperarPassword') }}</mat-error>
      }
    </mat-form-field>
  </mat-dialog-content>

  <mat-dialog-actions align="end">
    <button mat-stroked-button type="button" (click)="cerrar()">Cancel</button>
    <button mat-flat-button color="primary" type="submit">Send</button>
  </mat-dialog-actions>
</form>
